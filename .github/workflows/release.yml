name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
      # The repository is checked against NIST SP 800-218 with ssdf-repo-check, pinned to its release commit, before
      # anything is packed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: INNERLUXES/ssdf-repo-check
          ref: dfda194a3ed35623b8b420df05e110b66d984586 # v1.0.0
          path: .ssdf
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: SSDF gate
        working-directory: .
        run: |
          node .ssdf/bin/ssdf-repo-check.js repo --format markdown >> "$GITHUB_STEP_SUMMARY"
          node .ssdf/bin/ssdf-repo-check.js repo --require-all --fail-on-problem
      - name: Test before packing
        run: |
          npm ci
          npm run check
          npm test
          npm run example
          git diff --exit-code -- examples
      - name: Package, SBOM and checksums
        run: |
          mkdir dist
          npm pack --pack-destination dist
          npm sbom --sbom-format cyclonedx > dist/tenant-scope-check.cdx.json
          cd dist && sha256sum * > SHA256SUMS
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: repo/dist/*.tgz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="## ${GITHUB_REF_NAME#v}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "$notes"
